<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="68" viewBox="0 0 1200 68" role="img" aria-label="Создаю Aura. Разрабатываю JARVIS. Превращаю идеи в приложения.">
  <title>Создаю Aura. Разрабатываю JARVIS. Превращаю идеи в приложения.</title>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#19162d"/><stop offset="1" stop-color="#0c101c"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#d6bcff"/><stop offset=".5" stop-color="#a286ff"/><stop offset="1" stop-color="#79d9ff"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#a56aff" stop-opacity=".5"/><stop offset=".5" stop-color="#7650d5" stop-opacity=".2"/><stop offset="1" stop-color="#7650d5" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; }
    .muted { fill: #a6a5bf; }
    @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes rotate { to { transform:rotate(360deg); } }
    .breathing { animation:breathe 5s ease-in-out infinite; }
    .orbit { transform-box:fill-box; transform-origin:center; animation:rotate 36s linear infinite; }
    @media (prefers-reduced-motion:reduce) { .orbit,.breathing { animation:none; } }
  </style>
  <defs><clipPath id="line-0"><rect x="55" y="0" width="0" height="65">
      <animate attributeName="width" values="0;0;1080;1080;0;0" keyTimes="0;0.0006;0.1667;0.2778;0.3278;1" calcMode="linear" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath></defs>
    <text x="55" y="40" class="mono" font-size="24" fill="#c2a6ff" clip-path="url(#line-0)">&gt; Создаю Aura — мессенджер с характером.</text>
<defs><clipPath id="line-1"><rect x="55" y="0" width="0" height="65">
      <animate attributeName="width" values="0;0;1080;1080;0;0" keyTimes="0;0.3339;0.5000;0.6111;0.6611;1" calcMode="linear" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath></defs>
    <text x="55" y="40" class="mono" font-size="24" fill="#c2a6ff" clip-path="url(#line-1)">&gt; Разрабатываю JARVIS — голосовой помощник.</text>
<defs><clipPath id="line-2"><rect x="55" y="0" width="0" height="65">
      <animate attributeName="width" values="0;0;1080;1080;0;0" keyTimes="0;0.6672;0.8333;0.9444;0.9944;1" calcMode="linear" dur="18s" repeatCount="indefinite"/>
    </rect></clipPath></defs>
    <text x="55" y="40" class="mono" font-size="24" fill="#c2a6ff" clip-path="url(#line-2)">&gt; Превращаю идеи в приложения.</text>
</svg>
